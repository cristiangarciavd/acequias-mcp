[project]
name = "acequias"
version = "0.1.0"
description = "MCP server for Acequias, a 3D-printed hex board game about water and Mendoza vineyards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
acequias-server = "server.app:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acequias", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
